<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Product Manager</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; background: linear-gradient(180deg, #eff7ff 0%, #f8fafc 100%); color: #1f2937; }
    .page { max-width: 1120px; margin: 0 auto; padding: 32px 24px; }
    header { margin-bottom: 24px; }
    h1 { margin: 0 0 8px; font-size: 2.4rem; color: #0f172a; }
    p.subtitle { margin: 0; color: #475569; font-size: 1rem; }
    .card { background: #ffffff; border-radius: 28px; box-shadow: 0 25px 60px rgba(15, 23, 42, 0.08); padding: 28px; margin-bottom: 30px; }
    .grid { display: grid; grid-template-columns: 1.4fr 0.9fr; gap: 30px; }
    .form-group { display: flex; flex-direction: column; gap: 10px; }
    label { font-size: 0.95rem; color: #334155; }
    input[type=text], input[type=number], textarea, input[type=file] { width: 100%; padding: 14px 16px; border: 1px solid #cbd5e1; border-radius: 16px; background: #f8fafc; color: #0f172a; }
    input[type=file] { padding: 12px 16px; }
    textarea { resize: vertical; min-height: 140px; }
    .form-actions { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; margin-top: 18px; }
    button { padding: 14px 22px; border: none; border-radius: 16px; cursor: pointer; font-weight: 700; transition: transform 0.2s ease, background 0.2s ease; }
    button:hover { transform: translateY(-1px); }
    button.primary { background: #2563eb; color: white; }
    button.secondary { background: #475569; color: white; }
    button.danger { background: #dc2626; color: white; }
    .message { margin-bottom: 20px; color: #0f5132; background: #ddf7e8; padding: 16px 20px; border-radius: 16px; display: none; }
    .image-preview { margin-top: 14px; display: flex; gap: 14px; flex-wrap: wrap; align-items: center; }
    .image-preview img { width: 180px; height: 180px; object-fit: cover; border-radius: 22px; border: 1px solid #cbd5e1; box-shadow: 0 12px 30px rgba(15, 23, 42, 0.08); }
    .image-preview span { color: #475569; font-size: 0.96rem; }
    .preview-label { font-size: 0.9rem; color: #64748b; }
    table { width: 100%; border-collapse: separate; border-spacing: 0; background: white; border-radius: 22px; overflow: hidden; box-shadow: 0 25px 65px rgba(15, 23, 42, 0.08); }
    input[type=text], input[type=number], textarea, input[type=file] { width: 100%; padding: 12px 14px; border: 1px solid #cbd5e1; border-radius: 12px; background: #f8fafc; color: #0f172a; }
    input[type=file] { padding: 10px 14px; }
    textarea { resize: vertical; min-height: 120px; }
    .form-actions { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-top: 12px; }
    button { padding: 12px 20px; border: none; border-radius: 12px; cursor: pointer; font-weight: 600; transition: transform 0.2s ease, background 0.2s ease; }
    button:hover { transform: translateY(-1px); }
    button.primary { background: #2563eb; color: white; }
    button.secondary { background: #475569; color: white; }
    button.danger { background: #dc2626; color: white; }
    .message { margin-bottom: 16px; color: #0f5132; background: #d1fae5; padding: 14px 18px; border-radius: 12px; display: none; }
    .image-preview { margin-top: 10px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    .image-preview img { width: 160px; height: 160px; object-fit: cover; border-radius: 18px; border: 1px solid #cbd5e1; box-shadow: 0 8px 25px rgba(15, 23, 42, 0.08); }
    .image-preview span { color: #475569; font-size: 0.95rem; }
    .preview-label { font-size: 0.9rem; color: #64748b; }
    table { width: 100%; border-collapse: separate; border-spacing: 0; background: white; border-radius: 20px; overflow: hidden; box-shadow: 0 20px 50px rgba(15, 23, 42, 0.08); }
    th, td { padding: 18px 16px; text-align: left; vertical-align: middle; }
    thead { background: #eff6ff; }
    th { color: #0f172a; font-size: 0.96rem; }
    td { border-top: 1px solid #e2e8f0; color: #475569; }
    td img { width: 96px; height: 96px; object-fit: cover; border-radius: 14px; }
    .actions button { margin-right: 8px; margin-bottom: 8px; }
    .empty-state { padding: 40px 0; color: #64748b; text-align: center; }
    @media (max-width: 900px) {
      .grid { grid-template-columns: 1fr; }
      th, td { padding: 14px 12px; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <h1>Product Manager</h1>
      <p class="subtitle">Add products with images, view them in the list, and keep everything organized.</p>
    </header>
    <div class="message" id="message"></div>
    <div class="card">
    <form id="product-form">
      <input type="hidden" id="product-id" />
      <div class="grid">
        <div class="form-group">
          <label for="name">Name</label>
          <input id="name" type="text" placeholder="Product name" required />
        </div>
        <div class="form-group">
          <label for="price">Price</label>
          <input id="price" type="number" step="0.01" placeholder="Product price" required />
        </div>
      </div>
      <div class="form-group">
        <label for="description">Description</label>
        <textarea id="description" rows="4" placeholder="Product description"></textarea>
      </div>
      <div class="form-group">
        <label for="image">Picture</label>
        <input id="image" type="file" accept="image/*" />
        <div class="image-preview" id="image-preview"></div>
      </div>
      <div class="form-actions">
        <button type="submit" class="primary">Save Product</button>
        <button type="button" id="cancel-edit" class="secondary" style="display:none;">Cancel</button>
      </div>
    </form>
  </div>

  <div class="card">
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Price</th>
            <th>Image</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="product-list"></tbody>
      </table>
    </div>
  </div>

  <script>
    const apiBase = '/api/products';
    const message = document.getElementById('message');
    const form = document.getElementById('product-form');
    const cancelEdit = document.getElementById('cancel-edit');
    const imageInput = document.getElementById('image');
    const imagePreview = document.getElementById('image-preview');

    function showPreview(url) {
      imagePreview.innerHTML = url
        ? `<img src="${url}" alt="Preview" /><span>Current image preview</span>`
        : '';
    }

    imageInput.addEventListener('change', () => {
      const file = imageInput.files[0];
      if (!file) {
        return;
      }
      const reader = new FileReader();
      reader.onload = () => {
        imagePreview.innerHTML = `<img src="${reader.result}" alt="Selected picture" /><span>Selected picture preview</span>`;
      };
      reader.readAsDataURL(file);
    });

    async function fetchProducts() {
      const response = await fetch(apiBase);
      const result = await response.json();
      if (result.success) {
        renderProductList(result.data);
      }
    }

    function renderProductList(products) {
      const list = document.getElementById('product-list');
      list.innerHTML = '';

      if (!products.length) {
        list.innerHTML = '<tr><td colspan="5" class="empty-state">No products found yet. Add a product to see it here.</td></tr>';
        return;
      }

      products.forEach(product => {
        const row = document.createElement('tr');
        row.innerHTML = `
          <td>${product.id}</td>
          <td>${product.name}</td>
          <td>${Number(product.price).toFixed(2)}</td>
          <td>${product.imageUrl ? `<img src="${product.imageUrl}" alt="${product.name}" onerror="this.onerror=null;this.src='https://via.placeholder.com/96x96?text=No+Image'" />` : 'No image'}</td>
          <td class="actions">
            <button class="primary" onclick="viewProduct(${product.id})">View</button>
            <button class="secondary" onclick="editProduct(${product.id})">Edit</button>
            <button class="danger" onclick="deleteProduct(${product.id})">Delete</button>
          </td>
        `;
        list.appendChild(row);
      });
    }

    function showMessage(text) {
      message.textContent = text;
      message.style.display = 'block';
      setTimeout(() => { message.style.display = 'none'; }, 3000);
    }

    async function viewProduct(id) {
      const response = await fetch(`${apiBase}/${id}`);
      const result = await response.json();
      if (result.success) {
        const product = result.data;
        alert(`Name: ${product.name}\nPrice: ${Number(product.price).toFixed(2)}\nDescription: ${product.description || 'None'}`);
      }
    }

    async function editProduct(id) {
      const response = await fetch(`${apiBase}/${id}`);
      const result = await response.json();
      if (result.success) {
        const product = result.data;
        document.getElementById('product-id').value = product.id;
        document.getElementById('name').value = product.name;
        document.getElementById('description').value = product.description || '';
        document.getElementById('price').value = Number(product.price).toFixed(2);
        showPreview(product.imageUrl);
        cancelEdit.style.display = 'inline-block';
      }
    }

    async function deleteProduct(id) {
      if (!confirm('Delete this product?')) return;
      const response = await fetch(`${apiBase}/${id}`, { method: 'DELETE' });
      const result = await response.json();
      if (result.success) {
        showMessage('Product deleted successfully');
        fetchProducts();
      }
    }

    form.addEventListener('submit', async event => {
      event.preventDefault();

      const id = document.getElementById('product-id').value;
      const name = document.getElementById('name').value;
      const description = document.getElementById('description').value;
      const price = document.getElementById('price').value;
      const image = document.getElementById('image').files[0];

      const formData = new FormData();
      formData.append('name', name);
      formData.append('description', description);
      formData.append('price', price);
      if (image) {
        formData.append('image', image);
      }

      const method = id ? 'PUT' : 'POST';
      const url = id ? `${apiBase}/${id}` : apiBase;

      const response = await fetch(url, { method, body: formData });
      const result = await response.json();
      if (result.success) {
        showMessage(result.message);
        if (!id) {
          form.reset();
          imagePreview.innerHTML = '';
        }
        document.getElementById('product-id').value = '';
        cancelEdit.style.display = 'none';
        fetchProducts();
      } else {
        alert(result.message || 'Failed to save product');
      }
    });

    cancelEdit.addEventListener('click', () => {
      form.reset();
      document.getElementById('product-id').value = '';
      imagePreview.innerHTML = '';
      cancelEdit.style.display = 'none';
    });

    fetchProducts();
  </script>
</body>
</html>
